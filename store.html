<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number-Cal: Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a); }
    </style>
</head>
<body class="font-poppins min-h-screen text-slate-100 pb-12">
    <!-- Streamlined Navigation Header -->
    <header>
        <h1>
            <span>📦</span> Number-Cal <span class="text-amber-400">Chart Store</span>
        </h1>
        <nav>
            <a href="index.html" class="nav-link nav-link-editor">📊 Editor</a>
            <a href="store.html" class="nav-link nav-link-store active">📦 Store</a>
            <a href="import.html" class="nav-link nav-link-import">📥 Importer</a>
            <a href="link.html" class="nav-link nav-link-link">🔗 Link View</a>
            <a href="predictor.html" class="nav-link nav-link-predictor">⚡ Predictor Engine</a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
        <!-- Top Toolbar -->
        <div class="glass-panel p-6 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-2xl font-black text-amber-400">Your Saved Chart Repositories</h2>
                <p class="text-xs text-slate-400">Select any matrix to launch directly into the Predictor, Editor, or Link View</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <a href="import.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-lg flex items-center gap-2">
                    <span>📥 Import New Chart</span>
                </a>
                <button id="delete-all-btn" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-lg hidden">
                    🗑️ Delete All
                </button>
            </div>
        </div>

        <!-- Chart List Container -->
        <div id="chart-list" class="space-y-4"></div>
    </main>

    <script>
        const chartList = document.getElementById('chart-list');
        const deleteAllBtn = document.getElementById('delete-all-btn');
        
        function renderChartList() {
            chartList.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            const chartLabels = Object.keys(history).sort();

            if (chartLabels.length === 0) {
                chartList.innerHTML = `
                    <div class="glass-panel p-12 text-center rounded-3xl space-y-4">
                        <div class="text-5xl">📊</div>
                        <h3 class="text-xl font-bold text-slate-300">No Saved Charts Found</h3>
                        <p class="text-sm text-slate-400 max-w-md mx-auto">Create a new chart grid in the Editor or import copied Jodi tables instantly using the Importer Gateway.</p>
                        <div class="flex justify-center gap-4 pt-2">
                            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-md">Create Chart</a>
                            <a href="import.html" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-md">Import Jodi Data</a>
                        </div>
                    </div>
                `;
                deleteAllBtn.classList.add('hidden');
                return;
            }

            deleteAllBtn.classList.remove('hidden');
            chartLabels.forEach((label, idx) => {
                const chartData = history[label];
                let cellCount = 0;
                if (chartData.data) {
                    chartData.data.forEach(row => {
                        if (row) row.forEach(c => { if (c && c.val) cellCount++; });
                    });
                }

                const chartItem = document.createElement('div');
                chartItem.className = 'glass-panel p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition hover:border-amber-500/50 animate-fadeIn';
                chartItem.style.animationDelay = `${idx * 0.05}s`;
                
                // Chart Title & Details
                const infoContainer = document.createElement('div');
                infoContainer.className = 'space-y-1';

                const titleBtn = document.createElement('button');
                titleBtn.className = 'text-xl font-extrabold text-amber-400 hover:text-amber-300 hover:underline text-left cursor-pointer';
                titleBtn.textContent = label;
                titleBtn.onclick = () => {
                    localStorage.setItem('chartToLoad', label);
                    window.location.href = 'index.html';
                };

                const meta = document.createElement('p');
                meta.className = 'text-xs text-slate-400 flex flex-wrap items-center gap-3';
                meta.innerHTML = `
                    <span class="bg-slate-800 px-2.5 py-1 rounded-md text-slate-300 font-mono">📐 ${chartData.rows || 0} Rows × ${chartData.cols || 7} Cols</span>
                    <span class="bg-slate-800 px-2.5 py-1 rounded-md text-emerald-400 font-mono">🔢 ${cellCount} Jodis Filled</span>
                `;

                infoContainer.appendChild(titleBtn);
                infoContainer.appendChild(meta);
                
                // Action Buttons
                const actionContainer = document.createElement('div');
                actionContainer.className = 'flex flex-wrap items-center gap-2 w-full md:w-auto justify-end';
                
                const predictBtn = document.createElement('button');
                predictBtn.className = 'bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white font-bold py-2 px-3.5 rounded-xl text-xs transition shadow-md flex items-center gap-1';
                predictBtn.innerHTML = '⚡ <span>Predict</span>';
                predictBtn.onclick = () => {
                    localStorage.setItem('chartToLoadForPredictor', label);
                    window.location.href = 'predictor.html';
                };

                const linkBtn = document.createElement('button');
                linkBtn.className = 'bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-3.5 rounded-xl text-xs transition shadow-md flex items-center gap-1';
                linkBtn.innerHTML = '🔗 <span>Link View</span>';
                linkBtn.onclick = () => {
                    localStorage.setItem('chartToLoadForLink', label);
                    window.location.href = 'link.html';
                };

                const editBtn = document.createElement('button');
                editBtn.className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3.5 rounded-xl text-xs transition shadow-md flex items-center gap-1';
                editBtn.innerHTML = '✏️ <span>Edit</span>';
                editBtn.onclick = () => {
                    localStorage.setItem('chartToLoad', label);
                    window.location.href = 'index.html';
                };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 px-3.5 rounded-xl text-xs transition shadow-md flex items-center gap-1';
                deleteBtn.innerHTML = '🗑️ <span>Delete</span>';
                deleteBtn.onclick = () => {
                    if (confirm(`Are you sure you want to delete the chart "${label}"?`)) {
                        deleteChart(label);
                    }
                };

                actionContainer.appendChild(predictBtn);
                actionContainer.appendChild(linkBtn);
                actionContainer.appendChild(editBtn);
                actionContainer.appendChild(deleteBtn);

                chartItem.appendChild(infoContainer);
                chartItem.appendChild(actionContainer);
                chartList.appendChild(chartItem);
            });
        }

        function deleteChart(label) {
            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            delete history[label];
            localStorage.setItem('chartHistory', JSON.stringify(history));
            renderChartList();
        }
        
        deleteAllBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to delete ALL your saved charts? This action cannot be undone.")) {
                localStorage.removeItem('chartHistory');
                renderChartList();
            }
        });

        renderChartList();
    </script>
</body>
</html>
