<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number-Cal: Jodi Chart Importer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a, #064e3b, #0f172a); }
    </style>
</head>
<body class="font-poppins min-h-screen text-slate-100 pb-12">
    <!-- Streamlined Navigation Header -->
    <header>
        <h1>
            <span>📥</span> Number-Cal <span class="text-emerald-400">Jodi Importer</span>
        </h1>
        <nav>
            <a href="index.html" class="nav-link nav-link-editor">📊 Editor</a>
            <a href="store.html" class="nav-link nav-link-store">📦 Store</a>
            <a href="import.html" class="nav-link nav-link-import active">📥 Importer</a>
            <a href="link.html" class="nav-link nav-link-link">🔗 Link View</a>
            <a href="predictor.html" class="nav-link nav-link-predictor">⚡ Predictor Engine</a>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto p-4 md:p-8 space-y-6">
        <div class="glass-panel p-6 md:p-8 rounded-3xl space-y-6 animate-fadeIn">
            <div>
                <h2 class="text-2xl font-black text-emerald-400 flex items-center gap-2">
                    <span>📥</span> Instant Chart Data Gateway
                </h2>
                <p class="text-xs text-slate-300 mt-1">Copy raw text or table data from any chart site, paste it below, and the engine will filter valid 2-digit numbers into a structured chart matrix.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Chart Title</label>
                    <input type="text" id="chartTitle" value="Sridevi-Jodi-Chart" placeholder="Enter Chart Title" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Columns (5-8)</label>
                    <input type="number" id="chartCols" value="7" min="5" max="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none focus:border-emerald-500 text-center">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Paste Raw Copied Data Here</label>
                <textarea id="rawJodiInput" rows="9" placeholder="Paste raw text here... e.g. 55 37 92 83 33 29 40 ** 88 12..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white font-mono text-sm outline-none focus:border-emerald-500"></textarea>
            </div>

            <button onclick="importJodiData()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold py-4 rounded-xl shadow-xl transition transform active:scale-[0.99] flex items-center justify-center gap-2">
                <span>🚀 PROCESS & SAVE TO STORE</span>
            </button>
        </div>

        <!-- Success Notification Box -->
        <div id="successBox" class="glass-panel p-6 rounded-3xl hidden space-y-4 border border-emerald-500/40 bg-emerald-950/30 animate-fadeIn">
            <div class="flex items-center gap-3">
                <span class="text-3xl">✅</span>
                <div>
                    <h3 id="successTitle" class="text-lg font-bold text-emerald-400">Chart Imported Successfully!</h3>
                    <p id="successDetails" class="text-xs text-slate-300"></p>
                </div>
            </div>
            <div class="flex flex-wrap gap-3 pt-2">
                <button id="btnOpenEditor" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition">📊 Launch Editor</button>
                <button id="btnOpenPredictor" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition">⚡ Run Predictor</button>
                <button id="btnOpenStore" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition">📦 View Store</button>
            </div>
        </div>
    </main>

    <script>
        function calculateCN(num) {
            if (!num || num.length !== 2 || !/^\d{2}$/.test(num)) return null;
            const a = parseInt(num[0]), b = parseInt(num[1]);
            return (a + b + a + a) % 10;
        }

        function calculateCloseCond(num) {
            if (!num || num.length !== 2 || !/^\d{2}$/.test(num)) return null;
            const a = parseInt(num[0]), b = parseInt(num[1]);
            return ((a + b) % 10 + (b + b) % 10) % 10;
        }

        function importJodiData() {
            const title = document.getElementById('chartTitle').value.trim();
            const rawText = document.getElementById('rawJodiInput').value.trim();
            const cols = parseInt(document.getElementById('chartCols').value) || 7;

            if (!title) {
                alert("Please provide a chart name.");
                return;
            }
            if (cols < 5 || cols > 8) {
                alert("Columns must be between 5 and 8.");
                return;
            }
            if (!rawText) {
                alert("Please paste chart text data into the textarea first.");
                return;
            }

            const tokens = rawText.split(/\s+/);
            let validJodis = [];

            tokens.forEach(token => {
                const clean = token.trim();
                if (clean === '*' || clean === '**') {
                    validJodis.push('**');
                } else if (/^\d{2}$/.test(clean)) {
                    validJodis.push(clean);
                }
            });

            if (validJodis.length === 0) {
                alert("No valid 2-digit Jodi numbers or '**' tokens found in your text.");
                return;
            }

            let gridData = [];
            let currentRow = [];

            validJodis.forEach(val => {
                const cn = val === '**' ? null : calculateCN(val);
                const close = val === '**' ? null : calculateCloseCond(val);

                currentRow.push({ val, cn, close });

                if (currentRow.length === cols) {
                    gridData.push(currentRow);
                    currentRow = [];
                }
            });

            if (currentRow.length > 0) {
                while (currentRow.length < cols) {
                    currentRow.push(null);
                }
                gridData.push(currentRow);
            }

            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            history[title] = {
                rows: gridData.length,
                cols: cols,
                data: gridData,
                updatedAt: new Date().toISOString()
            };
            localStorage.setItem('chartHistory', JSON.stringify(history));

            const successBox = document.getElementById('successBox');
            const successDetails = document.getElementById('successDetails');
            successDetails.textContent = `Extracted ${validJodis.length} Jodis organized into ${gridData.length} rows with ${cols} columns. Saved to localStorage!`;
            successBox.classList.remove('hidden');

            document.getElementById('btnOpenEditor').onclick = () => {
                localStorage.setItem('chartToLoad', title);
                window.location.href = 'index.html';
            };
            document.getElementById('btnOpenPredictor').onclick = () => {
                localStorage.setItem('chartToLoadForPredictor', title);
                window.location.href = 'predictor.html';
            };
            document.getElementById('btnOpenStore').onclick = () => {
                window.location.href = 'store.html';
            };
        }
    </script>
</body>
</html>
