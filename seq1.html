<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seq Pattern Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; }
        .match-card {
            border-left: 6px solid #059669;
            background: #1e293b;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeIn 0.4s ease-out;
        }
        .match-card:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .highlight { font-weight: 800; }
        .table-container {
            overflow: auto;
            background: white;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; color: #000; }
        td, th {
            border: 1px solid #cbd5e1;
            text-align: center;
            padding: 4px;
            font-weight: 600;
        }
        #drawingCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
    </style>
</head>
<body class="pb-20">
    <header>
        <h1>
            <span>🔍</span> Number-Cal <span class="text-emerald-400">Seq Analyzer</span>
        </h1>
        <nav>
            <a href="index.html" class="nav-link nav-link-editor">📊 Editor</a>
            <a href="store.html" class="nav-link nav-link-store">📦 Store</a>
            <a href="import.html" class="nav-link nav-link-import">📥 Importer</a>
            <a href="link.html" class="nav-link nav-link-link">🔗 Link View</a>
            <a href="predictor.html" class="nav-link nav-link-predictor">⚡ Predictor Engine</a>
        </nav>
    </header>

    <main class="container mx-auto px-4 mt-8">
        <div class="glass-panel p-6 md:p-8 rounded-3xl shadow-2xl mb-10">
            <h2 class="text-xl font-bold text-emerald-400 mb-6 flex items-center gap-2">
                <span>🔗</span> Sequential Middle-Target Pattern Finder
            </h2>
       
            <div class="grid-inputs grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Select Chart</label>
                    <select id="chartSelector" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 outline-none focus:border-emerald-500">
                        <option value="">-- Choose a Chart --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Diagonal Logic</label>
                    <select id="logicType" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 outline-none focus:border-emerald-500">
                        <option value="open">Diagonal Open Sum</option>
                        <option value="close">Diagonal Close Sum</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="runSearch" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                        FIND MATCHES
                    </button>
                </div>
            </div>
         
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Row Range</label>
                    <div class="flex gap-2">
                        <input type="number" id="startRow" value="1" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 flex-1">
                        <input type="number" id="endRow" value="500" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 flex-1">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">Column Range</label>
                    <div class="flex gap-2">
                        <input type="number" id="startCol" value="1" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 flex-1">
                        <input type="number" id="endCol" value="100" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 flex-1">
                    </div>
                </div>
            </div>
            <div id="resultsBox" class="mt-8 p-4 bg-slate-900 rounded-2xl border border-slate-700 max-h-80 overflow-y-auto">
                <p class="text-slate-400 italic text-center py-4">Matches will be listed here...</p>
            </div>
        </div>

        <div id="statsSection" class="glass-panel p-4 rounded-xl hidden mb-4">
            <h3 class="text-lg font-bold text-emerald-400 mb-1">Chart Stats</h3>
            <p id="chartStats" class="text-sm text-slate-300"></p>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-slate-200" id="currentTitle">No Chart Loaded</h3>
            <button onclick="clearMarks()" class="text-xs bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg transition">Clear Marks</button>
        </div>
   
        <div class="table-container">
            <canvas id="drawingCanvas"></canvas>
            <table id="displayGrid"></table>
        </div>
    </main>

    <script>
        let gridData = [];
        let rows = 0, cols = 0;
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#059669', '#10b981', '#34d399', '#6ee7b7', '#9cd9c5'];

        const constPairs = {1: 6, 2: 7, 3: 8, 4: 9, 5: 0};

        function initCharts() {
            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            const select = document.getElementById('chartSelector');
            select.innerHTML = '<option value="">-- Choose a Chart --</option>';
            Object.keys(history).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                select.appendChild(opt);
            });
        }

        document.getElementById('chartSelector').onchange = (e) => {
            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            const chartName = e.target.value;
            const chart = history[chartName];
            if (chart) {
                gridData = ensureGridData(chart.data);
                rows = chart.rows || gridData.length;
                cols = chart.cols || (rows > 0 ? gridData[0].length : 0);
                document.getElementById('currentTitle').innerText = `Viewing: ${chartName}`;
                const stats = computeBasicStats(gridData, rows, cols);
                const statsSection = document.getElementById('statsSection');
                document.getElementById('chartStats').innerText = `Total cells: ${rows * cols}, Valid two-digit cells: ${stats.validCells}`;
                statsSection.classList.remove('hidden');
                renderGrid();
            }
        };

        function ensureGridData(data) {
            if (!Array.isArray(data) || data.length === 0) return [];
            return data.map(row => {
                if (!Array.isArray(row)) return [];
                return row.map(cell => {
                    let val = (cell && typeof cell === 'object' && cell.val !== undefined) ? cell.val : cell;
                    val = String(val || '').trim();
                    return /^\d{1,2}$/.test(val) ? val.padStart(2, '0') : '';
                });
            });
        }

        function computeBasicStats(grid, r, c) {
            let valid = 0;
            for (let i = 0; i < r; i++) {
                for (let j = 0; j < c; j++) {
                    if (/^\d{2}$/.test(grid[i][j])) valid++;
                }
            }
            return { validCells: valid };
        }

        function renderGrid() {
            const table = document.getElementById('displayGrid');
            table.innerHTML = '';
            for(let r=0; r<rows; r++) {
                const tr = document.createElement('tr');
                for(let c=0; c<cols; c++) {
                    const td = document.createElement('td');
                    td.id = `cell-${r}-${c}`;
                    let cell = gridData[r][c];
                    td.innerText = (cell && /^\d{2}$/.test(cell)) ? cell : (cell || '');
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
            const resizeObserver = new ResizeObserver(() => {
                canvas.width = table.offsetWidth;
                canvas.height = table.offsetHeight;
            });
            resizeObserver.observe(table);
            setTimeout(() => {
                canvas.width = table.offsetWidth;
                canvas.height = table.offsetHeight;
            }, 100);
        }

        document.getElementById('runSearch').onclick = () => {
            clearMarks();
            const box = document.getElementById('resultsBox');
            const logic = document.getElementById('logicType').value;
            const startRow = Math.max(0, parseInt(document.getElementById('startRow').value) - 1);
            const endRow = Math.min(rows - 3, parseInt(document.getElementById('endRow').value) - 1);
            const startCol = Math.max(0, parseInt(document.getElementById('startCol').value) - 1);
            const endCol = Math.min(cols - 1, parseInt(document.getElementById('endCol').value) - 1);
            let matchCounter = 0;
            box.innerHTML = '';

            const openMap = new Array(rows);
            const closeMap = new Array(rows);
            const totalMap = new Array(rows);
            for (let i = 0; i < rows; i++) {
                openMap[i] = new Array(cols).fill(null);
                closeMap[i] = new Array(cols).fill(null);
                totalMap[i] = new Array(cols).fill(null);
                for (let j = 0; j < cols; j++) {
                    const v = gridData[i][j];
                    if (/^\d{2}$/.test(v)) {
                        openMap[i][j] = parseInt(v[0]);
                        closeMap[i][j] = parseInt(v[1]);
                        totalMap[i][j] = (parseInt(v[0]) + parseInt(v[1])) % 10;
                    }
                }
            }

            for(let r = startRow; r <= endRow; r++) {
                for(let c = startCol; c <= endCol; c++) {
                    if (c + 2 < cols) {
                        const matches = findSeqPatternOptimized(r, c, 1, 1, logic, openMap, closeMap, totalMap, matchCounter);
                        matches.forEach(match => {
                            box.innerHTML += match.html;
                            drawSeqVisuals(match.pos, match.targetCoord, match.color);
                        });
                        matchCounter += matches.length;
                    }
                    if (c - 2 >= 0) {
                        const matches = findSeqPatternOptimized(r, c, 1, -1, logic, openMap, closeMap, totalMap, matchCounter);
                        matches.forEach(match => {
                            box.innerHTML += match.html;
                            drawSeqVisuals(match.pos, match.targetCoord, match.color);
                        });
                        matchCounter += matches.length;
                    }
                }
            }
            if(box.innerHTML === '') {
                box.innerHTML = '<p class="text-center text-slate-400 italic">No patterns found.</p>';
            }
        };

        function findSeqPatternOptimized(r, c, dr, dc, logic, openMap, closeMap, totalMap, currentCounter) {
            const pos = [[r,c], [r+dr, c+dc], [r+2*dr, c+2*dc]];
            if (!pos.every(p => openMap[p[0]][p[1]] !== null)) return [];
            const diagMap = logic === 'open' ? openMap : closeMap;
            const diagSum = pos.reduce((a, p) => a + diagMap[p[0]][p[1]], 0) % 10;
            const matches = [];

            const middlePos = pos[1];
            const middleRow = middlePos[0];
            const middleCol = middlePos[1];
            const c2Col = middleCol - 1;
            if (c2Col >= 0 && totalMap[middleRow][c2Col] !== null) {
                const c1Digit = diagMap[middleRow][middleCol];
                const c2Total = totalMap[middleRow][c2Col];
                if (c1Digit !== null && c1Digit in constPairs && constPairs[c1Digit] === c2Total) {
                    const combined = (c1Digit + c2Total) % 10;
                    if (combined === diagSum) {
                        const color = colors[currentCounter % colors.length];
                        const vals = pos.map(p => gridData[p[0]][p[1]]);
                        const c1Val = gridData[middleRow][middleCol];
                        const c2Val = gridData[middleRow][c2Col];
                        matches.push({
                            html: `
                                <div class="match-card" style="border-left-color: ${color};">
                                    <div class="flex justify-between text-xs font-bold mb-2">
                                        <span style="color: ${color};">${logic.toUpperCase()} SUM: ${diagSum} (Pair: ${c1Digit}:${c2Total})</span>
                                        <span class="text-slate-400">Row ${middleRow + 1}, Middle Col ${middleCol + 1}</span>
                                    </div>
                                    Diagonal [${vals.join(', ')}] sum matches ${logic.toUpperCase()} of c1 <span class="highlight" style="color: ${color};">${c1Val}</span> (${c1Digit}) + TOTAL of c2 <span class="highlight" style="color: ${color};">${c2Val}</span> (${c2Total}) = ${combined} (mod 10).
                                </div>`,
                            pos: pos,
                            targetCoord: [middleRow, c2Col],
                            color: color
                        });
                    }
                }
            }
            return matches;
        }

        function drawSeqVisuals(diagonalCoords, targetCoord, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            let centers = [];
            diagonalCoords.forEach(p => {
                const el = document.getElementById(`cell-${p[0]}-${p[1]}`);
                if (el) {
                    ctx.strokeRect(el.offsetLeft + 2, el.offsetTop + 2, el.offsetWidth - 4, el.offsetHeight - 4);
                    centers.push({ x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 });
                }
            });
            if (centers.length === 3) {
                ctx.beginPath();
                ctx.moveTo(centers[0].x, centers[0].y);
                ctx.lineTo(centers[1].x, centers[1].y);
                ctx.lineTo(centers[2].x, centers[2].y);
                ctx.stroke();
            }
            const targetEl = document.getElementById(`cell-${targetCoord[0]}-${targetCoord[1]}`);
            if (targetEl) {
                const centerX = targetEl.offsetLeft + targetEl.offsetWidth / 2;
                const centerY = targetEl.offsetTop + targetEl.offsetHeight / 2;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
                ctx.stroke();
                const middleCenter = centers[1];
                if (middleCenter) {
                    ctx.beginPath();
                    ctx.setLineDash([4, 4]);
                    ctx.lineWidth = 1.5;
                    ctx.moveTo(middleCenter.x, middleCenter.y);
                    ctx.lineTo(centerX, centerY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.lineWidth = 2;
                }
            }
        }

        function clearMarks() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        initCharts();
    </script>
</body>
</html>
