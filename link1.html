<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number-Cal: Link View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        
        .table-container { 
            width: 100%;
            overflow-x: auto; 
            background: white;
            border-radius: 12px;
            -webkit-overflow-scrolling: touch;
        }
        
        table.link-grid { 
            border-collapse: collapse; 
            width: 100%; 
            table-layout: fixed;
        }
        
        table.link-grid td, table.link-grid th { 
            border: 1px solid #cbd5e1; 
            text-align: center; 
            vertical-align: middle;
            padding: 4px 0;
            height: 60px;
        }

        .original-num {
            font-size: 1.1rem;
            font-weight: 800;
            display: block;
            line-height: 1.1;
        }

        .transform-num {
            font-size: 0.75rem;
            font-weight: 800;
            color: #16a34a; 
            display: block;
            line-height: 1;
            margin-top: 2px;
        }

        .row-id {
            background: #f8fafc;
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            width: 40px;
        }

        @media (min-width: 768px) {
            table.link-grid td { height: 75px; }
            .original-num { font-size: 1.4rem; }
            .transform-num { font-size: 0.85rem; }
        }
    </style>
</head>
<body class="pb-12">
    <!-- Streamlined Navigation Header -->
    <header>
        <h1>
            <span>🔗</span> Number-Cal <span class="text-purple-400">Link View</span>
        </h1>
        <nav>
            <a href="index.html" class="nav-link nav-link-editor">📊 Editor</a>
            <a href="store.html" class="nav-link nav-link-store">📦 Store</a>
            <a href="import.html" class="nav-link nav-link-import">📥 Importer</a>
            <a href="link.html" class="nav-link nav-link-link active">🔗 Link View</a>
            <a href="predictor.html" class="nav-link nav-link-predictor">⚡ Predictor Engine</a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
        <!-- Chart Selector Card -->
        <div class="glass-panel p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="w-full md:w-auto">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Select Chart Matrix</label>
                <select id="chartSelector" class="w-full md:w-80 bg-slate-900 border border-slate-700 rounded-xl p-3 text-white font-bold outline-none focus:border-purple-500">
                    <option value="">-- Choose Saved Chart --</option>
                </select>
            </div>
            <div id="chartMeta" class="text-xs text-slate-400 font-mono hidden"></div>
        </div>

        <div id="viewContainer" class="hidden animate-fadeIn">
            <div class="table-container shadow-2xl">
                <table id="displayGrid" class="link-grid"></table>
            </div>
        </div>
    </main>

    <script>
        const redPairs = {0:5, 1:6, 2:7, 3:8, 4:9, 5:0, 6:1, 7:2, 8:3, 9:4};

        function isRed(num) {
            if (!num || num.length !== 2 || num === '**') return num === '**';
            const a = parseInt(num[0]), b = parseInt(num[1]);
            return a === b || redPairs[a] === b;
        }

        function getDoubleMod(val) {
            if (!val || val.length !== 2 || val === '**') return "";
            const d1 = (parseInt(val[0]) + parseInt(val[0])) % 10;
            const d2 = (parseInt(val[1]) + parseInt(val[1])) % 10;
            return `${d1}${d2}`;
        }

        function init() {
            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            const select = document.getElementById('chartSelector');
            select.innerHTML = '<option value="">-- Choose Saved Chart --</option>';

            Object.keys(history).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                select.appendChild(opt);
            });

            const preselect = localStorage.getItem('chartToLoadForLink');
            if (preselect && history[preselect]) {
                select.value = preselect;
                renderChart(preselect);
                localStorage.removeItem('chartToLoadForLink');
            }
        }

        document.getElementById('chartSelector').onchange = (e) => {
            if (e.target.value) {
                renderChart(e.target.value);
            } else {
                document.getElementById('viewContainer').classList.add('hidden');
                document.getElementById('chartMeta').classList.add('hidden');
            }
        };

        function renderChart(name) {
            const history = JSON.parse(localStorage.getItem('chartHistory')) || {};
            const chart = history[name];
            if (!chart) return;

            document.getElementById('chartMeta').textContent = `Matrix Dimensions: ${chart.rows} Rows × ${chart.cols} Columns`;
            document.getElementById('chartMeta').classList.remove('hidden');

            document.getElementById('viewContainer').classList.remove('hidden');
            renderGrid(chart.data, chart.rows, chart.cols);
        }

        function renderGrid(data, rows, cols) {
            const table = document.getElementById('displayGrid');
            table.innerHTML = '';

            // Header row
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const thead = document.createElement('thead');
            const hTr = document.createElement('tr');
            const cornerTh = document.createElement('th');
            cornerTh.className = 'row-id';
            cornerTh.textContent = '#';
            hTr.appendChild(cornerTh);

            for (let c = 0; c < cols; c++) {
                const th = document.createElement('th');
                th.className = 'bg-slate-800 text-slate-200 text-xs font-bold py-2';
                th.textContent = days[c] || `Col ${c+1}`;
                hTr.appendChild(th);
            }
            thead.appendChild(hTr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            for (let r = 0; r < rows; r++) {
                if (r > 150 && (!data[r] || !data[r].some(x => x && x.val))) continue;

                const tr = document.createElement('tr');
                const idTd = document.createElement('td');
                idTd.className = 'row-id';
                idTd.innerText = r + 1;
                tr.appendChild(idTd);

                for (let c = 0; c < cols; c++) {
                    const td = document.createElement('td');
                    const cell = data[r] && data[r][c];
                    
                    if (cell) {
                        const val = (typeof cell === 'object') ? cell.val : cell;
                        const redStatus = isRed(val);
                        const transform = getDoubleMod(val);
                        
                        td.innerHTML = `
                            <span class="original-num ${redStatus ? 'text-red' : 'text-slate-900'}">${val}</span>
                            <span class="transform-num">${transform}</span>
                        `;
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
